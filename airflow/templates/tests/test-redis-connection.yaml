apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Values.fullnameOverride }}-test-redis-connection"
  labels:
    app.kubernetes.io/name: "{{ .Values.fullnameOverride }}"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  containers:
    - name: redis
      image: redis:7.2
      command: ["sh", "-c"]
      args:
        - |
          redis-cli -h airflow-redis-master -p 6379 -a "$REDIS_PASSWORD" PING | grep PONG
      env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.secretName }}
              key: {{ .Values.secrets.redisPasswordKey }}
  restartPolicy: Never
