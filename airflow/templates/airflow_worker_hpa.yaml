{{- if .Values.autoscaling.airflowWorker.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.airflowWorker.fullnameOverride }}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.airflowWorker.fullnameOverride }}
  minReplicas: {{ .Values.autoscaling.airflowWorker.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.airflowWorker.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.airflowWorker.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.airflowWorker.targetMemoryUtilizationPercentage }}
{{- end }}
