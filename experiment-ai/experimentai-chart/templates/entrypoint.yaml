apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "experimentai-chart.fullname" . }}-entrypoint
data:
  entrypoint.sh: |-
    #!/bin/sh
    set -e
    
    # CREATE THE DATABASE, IF IT DOESN'T EXIST
    export PGPASSWORD=$POSTGRES_PASSWORD
    psql -h timescaledb-service -U $POSTGRES_USER -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_DB'" | grep -q 1 || \
    psql -h timescaledb-service -U $POSTGRES_USER -d postgres -c "CREATE DATABASE $POSTGRES_DB"

    # RUN ALEMBIC MIGRATIONS
    export PYTHONPATH=/app
    alembic upgrade head

    # START THE API SERVER
    uvicorn app.main:app --host 0.0.0.0 --port 8000
