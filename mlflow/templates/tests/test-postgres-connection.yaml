apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mlflow.fullname" . }}-test-postgres-connection"
  labels:
    app.kubernetes.io/name: "{{ include "mlflow.name" . }}"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  containers:
    - name: psql
      image: postgres:15
      command: ["sh", "-c"]
      args:
        - |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h timescaledb-service -U $POSTGRES_USER -d $MLFLOW_DB -c '\dt'
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.secretName }}
              key: {{ .Values.secrets.postgresUserKey }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.secretName }}
              key: {{ .Values.secrets.postgresPasswordKey }}
        - name: MLFLOW_DB
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.secretName }}
              key: {{ .Values.secrets.mlflowDbKey }}
  restartPolicy: Never
